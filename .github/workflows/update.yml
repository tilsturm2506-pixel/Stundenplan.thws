name: Stundenplan aktualisieren

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
    - cron: '30 4,5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# Standard: keine Rechte. Jeder Job bekommt nur, was er braucht.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Actions sind auf Commit-Hashes festgelegt (Schutz gegen nachträglich veränderte Tags)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Dateien erzeugen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          for i in 1 2 3; do
            if mvn -q -B compile org.codehaus.mojo:exec-maven-plugin:3.5.0:java -Dexec.mainClass=Main; then
              break
            fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 20 Sekunden"
            sleep 20
          done
          mkdir public
          cp web/* public/
          mv stundenplan.ics stundenplan.json public/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
