name: Stundenplan aktualisieren

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Dateien erzeugen
        run: |
          for i in 1 2 3; do
            if mvn -q -B compile org.codehaus.mojo:exec-maven-plugin:3.5.0:java -Dexec.mainClass=Main; then
              break
            fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 20 Sekunden"
            sleep 20
          done
          mkdir public
          mv stundenplan.ics stundenplan.json public/
          cp web/* public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4