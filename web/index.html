<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Stundenplan">
    <link rel="apple-touch-icon" href="icon.png">
    <title>Stundenplan BWI1</title>
    <script>
        try { const t = JSON.parse(localStorage.getItem('stundenplan.theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <style>
        :root { color-scheme: light; --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#6c6c70; --line:#d1d1d6;
            --accent:#0a66c2; --warn:#d97706; --warnbg:#fef3c7; --warntext:#92400e; }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) { color-scheme: dark; --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#9a9aa0;
                --line:#38383a; --accent:#4da3ff; --warn:#fbbf24; --warnbg:#451a03; --warntext:#fde68a; }
        }
        :root[data-theme="dark"] { color-scheme: dark; --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#9a9aa0;
            --line:#38383a; --accent:#4da3ff; --warn:#fbbf24; --warnbg:#451a03; --warntext:#fde68a; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin:0; background:var(--bg); color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
        main { max-width:640px; margin:0 auto; padding-bottom:32px; }

        .top { display:flex; align-items:center; justify-content:space-between; padding:14px 0 6px; }
        h1 { font-size:22px; margin:0; }
        .tools { display:flex; gap:8px; }
        .icon { background:var(--card); color:var(--accent); border:0; border-radius:10px; width:40px; height:40px;
            display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }

        .weeknav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0 4px; }
        .weeknav .right { display:flex; gap:6px; }
        .weeknav button { background:var(--card); color:var(--accent); border:0; border-radius:10px;
            padding:8px 14px; font-size:16px; cursor:pointer; }
        #range { font-weight:600; font-size:15px; }

        #list.in-right { animation: inRight .22s ease-out; }
        #list.in-left  { animation: inLeft .22s ease-out; }
        @keyframes inRight { from { opacity:0; transform:translateX(32px); } to { opacity:1; transform:none; } }
        @keyframes inLeft  { from { opacity:0; transform:translateX(-32px); } to { opacity:1; transform:none; } }

        .day { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; margin:18px 4px 6px; }
        .day.today { color:var(--accent); }

        .card { --c:#3b82f6; display:flex; gap:6px; background:var(--card);
            background:color-mix(in srgb, var(--c) 12%, var(--card));
            border-left:5px solid var(--c); border-radius:12px; padding:10px 6px 10px 14px; margin-bottom:8px; }
        .card.changed { box-shadow:0 0 0 2px var(--warn); }
        .card .body { flex:1; min-width:0; }
        .card .actions { display:flex; flex-direction:column; gap:2px; }
        .card .icon { background:transparent; width:36px; height:36px; color:var(--muted); }
        .card .icon.has { color:var(--accent); }
        .time { font-size:13px; font-weight:600; color:var(--c); }
        .title { font-weight:600; margin:2px 0; }
        .meta { font-size:14px; color:var(--muted); }
        .badge { display:inline-block; background:var(--warnbg); color:var(--warntext); font-size:12px; font-weight:600;
            border-radius:6px; padding:2px 7px; margin-top:6px; }
        .note { margin-top:6px; font-size:14px; white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:3;
            -webkit-box-orient:vertical; overflow:hidden; border-top:1px solid var(--line); padding-top:6px; }
        .empty, footer { color:var(--muted); font-size:14px; text-align:center; margin-top:20px; }

        dialog { border:0; border-radius:16px; padding:18px; width:min(92vw,420px); background:var(--card); color:var(--text); }
        dialog::backdrop { background:rgba(0,0,0,.5); }
        dialog h2 { font-size:18px; margin:0 0 8px; }
        label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
        input[type=text], input[type=date], input[type=time], textarea {
            width:100%; min-width:0; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:10px;
            background:var(--bg); color:var(--text); font-family:inherit; }
        textarea { min-height:140px; resize:vertical; }
        .row { display:flex; gap:10px; } .row > div { flex:1; min-width:0; }
        label.check { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:15px; color:var(--text); }
        input[type=checkbox] { width:20px; height:20px; }
        .swatches { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
        .sw { width:32px; height:32px; border-radius:50%; border:3px solid transparent; cursor:pointer; padding:0; }
        .sw.sel { border-color:var(--text); }
        .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
        .btn { border:0; border-radius:10px; padding:10px 16px; font-size:16px; background:var(--bg); color:var(--text); cursor:pointer; }
        .btn.primary { background:var(--accent); color:#fff; }
        .btn.danger { color:#dc2626; margin-right:auto; }
        .err { color:#dc2626; font-size:14px; min-height:18px; margin-top:8px; }
    </style>
</head>
<body>
<main>
    <div class="top">
        <h1>Stundenplan</h1>
        <div class="tools">
            <button class="icon" id="addBtn" aria-label="Modul hinzufügen"></button>
            <button class="icon" id="themeBtn" aria-label="Hell/Dunkel wechseln"></button>
        </div>
    </div>
    <div class="weeknav">
        <button id="prev" aria-label="Vorherige Woche">‹</button>
        <span id="range"></span>
        <div class="right"><button id="today">Heute</button><button id="next" aria-label="Nächste Woche">›</button></div>
    </div>
    <div id="list"></div>
    <footer id="stand"></footer>
</main>

<dialog id="noteDlg">
    <h2 id="noteTitle"></h2>
    <label for="noteText">Notiz</label>
    <textarea id="noteText"></textarea>
    <div class="btns">
        <button class="btn danger" id="noteDelete">Löschen</button>
        <button class="btn" id="noteCancel">Abbrechen</button>
        <button class="btn primary" id="noteSave">Speichern</button>
    </div>
</dialog>

<dialog id="addDlg">
    <h2>Eigenes Modul hinzufügen</h2>
    <label for="fName">Name</label>
    <input type="text" id="fName" autocomplete="off">
    <label for="fDate">Datum</label>
    <input type="date" id="fDate">
    <div class="row">
        <div><label for="fStart">Von</label><input type="time" id="fStart"></div>
        <div><label for="fEnd">Bis</label><input type="time" id="fEnd"></div>
    </div>
    <label for="fRoom">Raum (optional)</label>
    <input type="text" id="fRoom" autocomplete="off">
    <label class="check"><input type="checkbox" id="fRepeat"> Jede Woche wiederholen</label>
    <div id="untilWrap" style="display:none">
        <label for="fUntil">Wiederholen bis</label>
        <input type="date" id="fUntil">
    </div>
    <label>Farbe</label>
    <div class="swatches" id="swatches"></div>
    <div class="err" id="addErr"></div>
    <div class="btns">
        <button class="btn" id="addCancel">Abbrechen</button>
        <button class="btn primary" id="addSave">Hinzufügen</button>
    </div>
</dialog>

<script>
    const $ = id => document.getElementById(id);
    const DAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
    const PALETTE = ['#eab308','#8b5cf6','#22c55e','#ef4444','#3b82f6','#ec4899','#06b6d4','#64748b','#f97316','#84cc16'];
    const svg = p => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
    const ICON = {
        plus:   svg('<path d="M12 5v14M5 12h14"/>'),
        pencil: svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
        trash:  svg('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
        moon:   svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>'),
        sun:    svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>')
    };

    const store = {
        get(k, d) { try { const v = localStorage.getItem('stundenplan.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem('stundenplan.' + k, JSON.stringify(v)); } catch (e) {} }
    };

    let events = [], custom = store.get('custom', []), notes = store.get('notes', {});
    let weekStart = null, titleColor = {}, lastDate = '', noteKey = null, selColor = 0;

    const pad = n => String(n).padStart(2, '0');
    const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const fmt = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function monday(d) {
        const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
        return x;
    }

    /* ---------- Darkmode ---------- */
    const root = document.documentElement;
    const effectiveDark = () => root.dataset.theme ? root.dataset.theme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches;
    function themeIcon() { $('themeBtn').innerHTML = effectiveDark() ? ICON.sun : ICON.moon; }
    $('themeBtn').onclick = () => {
        const next = effectiveDark() ? 'light' : 'dark';
        root.dataset.theme = next; store.set('theme', next); themeIcon();
    };
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeIcon);
    $('addBtn').innerHTML = ICON.plus;
    themeIcon();

    /* ---------- Farben ---------- */
    function buildColors() {
        titleColor = {};
        [...new Set(events.map(e => e.title))].sort((a, b) => a.localeCompare(b, 'de'))
            .forEach((t, i) => titleColor[t] = i % PALETTE.length);
    }
    const colorOf = e => e.custom ? PALETTE[e.color % PALETTE.length] : PALETTE[titleColor[e.title] ?? 0];

    /* ---------- Termine eines Tages ---------- */
    function eventsOn(day) {
        const d = iso(day);
        const base = events.filter(e => e.date === d);
        const own = custom
            .filter(c => c.date === d ||
                (c.until && c.date < d && c.until >= d && new Date(c.date + 'T12:00:00').getDay() === day.getDay()))
            .map(c => ({ ...c, date: d, type: '', group: null, lecturer: null, note: null, changed: false, custom: true }));
        return [...base, ...own].sort((a, b) => a.start.localeCompare(b.start));
    }

    /* ---------- Darstellung ---------- */
    function render(dir) {
        if (!weekStart) return;
        $('range').textContent = `${fmt(weekStart)} – ${fmt(addDays(weekStart, 5))}${weekStart.getFullYear()}`;
        const today = iso(new Date());
        let html = '';
        for (let i = 0; i < 6; i++) {
            const day = addDays(weekStart, i);
            const list = eventsOn(day);
            if (!list.length) continue;
            html += `<div class="day ${iso(day) === today ? 'today' : ''}">${DAYS[day.getDay()]}, ${fmt(day)}</div>`;
            for (const e of list) {
                const meta = [e.group, e.lecturer, e.room].filter(Boolean).map(esc).join(' · ');
                const n = notes[e.title];
                html += `<div class="card ${e.changed ? 'changed' : ''}" style="--c:${colorOf(e)}">
        <div class="body">
          <div class="time">${esc(e.start)}–${esc(e.end)}</div>
          <div class="title">${esc((e.type ? e.type + ' ' : '') + e.title)}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ''}
          ${e.changed ? `<span class="badge">${esc(e.note || 'Änderung')}</span>` : ''}
          ${n ? `<div class="note">${esc(n)}</div>` : ''}
        </div>
        <div class="actions">
          <button class="icon ${n ? 'has' : ''}" data-act="note" data-title="${esc(e.title)}" aria-label="Notiz">${ICON.pencil}</button>
          ${e.custom ? `<button class="icon" data-act="del" data-id="${esc(e.id)}" aria-label="Modul löschen">${ICON.trash}</button>` : ''}
        </div>
      </div>`;
            }
        }
        const el = $('list');
        el.innerHTML = html || '<div class="empty">Keine Termine in dieser Woche.</div>';
        el.className = '';
        if (dir) { void el.offsetWidth; el.classList.add(dir > 0 ? 'in-right' : 'in-left'); }
    }

    function shift(n) { weekStart = addDays(weekStart, 7 * n); render(n); }
    function jumpToday() {
        const t = iso(new Date());
        const next = events.find(e => e.date >= t);
        const ref = next ? new Date(next.date + 'T12:00:00')
            : (events.length ? new Date(events[events.length - 1].date + 'T12:00:00') : new Date());
        const cur = monday(new Date());
        weekStart = events.some(e => e.date >= iso(cur) && e.date <= iso(addDays(cur, 5))) ? cur : monday(ref);
        render();
    }
    $('prev').onclick = () => shift(-1);
    $('next').onclick = () => shift(1);
    $('today').onclick = jumpToday;

    /* ---------- Wischen ---------- */
    let tx = 0, ty = 0, tracking = false;
    document.addEventListener('touchstart', e => {
        if (document.querySelector('dialog[open]')) return;
        tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; tracking = true;
    }, { passive: true });
    document.addEventListener('touchend', e => {
        if (!tracking) return; tracking = false;
        const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shift(dx < 0 ? 1 : -1);
    }, { passive: true });

    /* ---------- Notizen & Löschen ---------- */
    $('list').onclick = ev => {
        const b = ev.target.closest('button[data-act]');
        if (!b) return;
        if (b.dataset.act === 'note') {
            noteKey = b.dataset.title;
            $('noteTitle').textContent = noteKey;
            $('noteText').value = notes[noteKey] || '';
            $('noteDlg').showModal();
        } else if (b.dataset.act === 'del') {
            if (confirm('Dieses eigene Modul (alle Wiederholungen) löschen?')) {
                custom = custom.filter(c => c.id !== b.dataset.id);
                store.set('custom', custom); render();
            }
        }
    };
    $('noteSave').onclick = () => {
        const v = $('noteText').value.trim();
        if (v) notes[noteKey] = v; else delete notes[noteKey];
        store.set('notes', notes); $('noteDlg').close(); render();
    };
    $('noteDelete').onclick = () => {
        delete notes[noteKey]; store.set('notes', notes); $('noteDlg').close(); render();
    };
    $('noteCancel').onclick = () => $('noteDlg').close();

    /* ---------- Eigenes Modul hinzufügen ---------- */
    function drawSwatches() {
        $('swatches').innerHTML = PALETTE.map((c, i) =>
            `<button type="button" class="sw ${i === selColor ? 'sel' : ''}" style="background:${c}" data-i="${i}" aria-label="Farbe ${i + 1}"></button>`).join('');
    }
    $('swatches').onclick = ev => {
        const b = ev.target.closest('.sw'); if (!b) return;
        selColor = Number(b.dataset.i); drawSwatches();
    };
    $('fRepeat').onchange = () => { $('untilWrap').style.display = $('fRepeat').checked ? 'block' : 'none'; };
    $('addBtn').onclick = () => {
        ['fName', 'fRoom', 'fStart', 'fEnd'].forEach(id => $(id).value = '');
        $('fDate').value = iso(new Date());
        $('fRepeat').checked = false; $('untilWrap').style.display = 'none';
        $('fUntil').value = lastDate; $('addErr').textContent = '';
        selColor = Object.keys(titleColor).length % PALETTE.length;
        drawSwatches(); $('addDlg').showModal();
    };
    $('addCancel').onclick = () => $('addDlg').close();
    $('addSave').onclick = () => {
        const name = $('fName').value.trim(), date = $('fDate').value, start = $('fStart').value, end = $('fEnd').value;
        const rep = $('fRepeat').checked, until = $('fUntil').value;
        let err = '';
        if (!name) err = 'Bitte einen Namen eingeben.';
        else if (!date) err = 'Bitte ein Datum wählen.';
        else if (!start || !end || end <= start) err = 'Die Endzeit muss nach der Startzeit liegen.';
        else if (rep && (!until || until < date)) err = 'Das Enddatum der Wiederholung muss nach dem Startdatum liegen.';
        if (err) { $('addErr').textContent = err; return; }
        custom.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            title: name, date, start, end, room: $('fRoom').value.trim() || null,
            color: selColor, until: rep ? until : null });
        store.set('custom', custom);
        weekStart = monday(new Date(date + 'T12:00:00'));
        $('addDlg').close(); render();
    };
    ['noteDlg', 'addDlg'].forEach(id => $(id).addEventListener('click', e => { if (e.target === $(id)) $(id).close(); }));

    /* ---------- Daten laden ---------- */
    fetch('stundenplan.json', { cache: 'no-store' })
        .then(r => r.json())
        .then(d => {
            events = d.events;
            lastDate = events.reduce((m, e) => e.date > m ? e.date : m, '');
            buildColors();
            $('stand').textContent = 'Stand: ' + new Date(d.generated).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });
            jumpToday();
        })
        .catch(() => { $('list').innerHTML = '<div class="empty">Daten konnten nicht geladen werden.</div>'; });
</script>
</body>
</html>
