<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stundenplan">
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="icon.png?v=3">
<title>Stundenplan BWI1</title>
<script>try{const t=JSON.parse(localStorage.getItem('stundenplan.theme'));if(t)document.documentElement.dataset.theme=t;const a=JSON.parse(localStorage.getItem('stundenplan.accent'));if(a)document.documentElement.style.setProperty('--acc',a)}catch(e){}</script>
<style>
/* ───────── Design-Tokens ───────── */
:root{
  /* --sec/--ter angehoben: Sekundärtext ≥ 4,5:1, Tertiär (Deko/Icons) ≥ 3:1 */
  --bg:#eef1f7;--txt:#0b0b0f;--sec:rgba(60,60,67,.78);--ter:rgba(60,60,67,.58);--sep:rgba(60,60,67,.13);
  --acc:#007aff;--warn:#ff9500;--red:#ff3b30;--green:#34c759;
  /* Akzent als Textfarbe: im hellen Modus abgedunkelt, damit auch Grün/Orange lesbar bleiben */
  --acci:color-mix(in srgb,var(--acc) 64%,#000);
  --glass:rgba(255,255,255,.5);--glass2:rgba(250,250,253,.74);--gbrd:rgba(255,255,255,.72);--ghi:rgba(255,255,255,.95);
  --gsh:0 1px 1px rgba(16,24,40,.04),0 10px 30px -6px rgba(31,38,64,.14);
  --fill:rgba(118,118,128,.12);--lens:rgba(255,255,255,.9);--lsh:0 1px 2px rgba(0,0,0,.06),0 6px 16px -4px rgba(0,0,0,.14);
  --blob:.6;--sheen:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 46%);
  --spring:cubic-bezier(.34,1.45,.55,1);--ease:cubic-bezier(.2,.9,.3,1);
  --mw:680px
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#05060a;--txt:#f5f5f7;--sec:rgba(235,235,245,.62);--ter:rgba(235,235,245,.45);--acci:var(--acc);--sep:rgba(255,255,255,.09);
  --acc:#0a84ff;--warn:#ff9f0a;--red:#ff453a;--green:#30d158;
  --glass:rgba(36,38,46,.44);--glass2:rgba(34,36,44,.72);--gbrd:rgba(255,255,255,.11);--ghi:rgba(255,255,255,.16);
  --gsh:0 1px 1px rgba(0,0,0,.3),0 14px 36px -8px rgba(0,0,0,.55);
  --fill:rgba(118,118,128,.24);--lens:rgba(255,255,255,.15);--lsh:0 1px 2px rgba(0,0,0,.3),0 6px 18px -4px rgba(0,0,0,.5);
  --blob:.4;--sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 46%)}}
:root[data-theme=dark]{
  --bg:#05060a;--txt:#f5f5f7;--sec:rgba(235,235,245,.62);--ter:rgba(235,235,245,.45);--acci:var(--acc);--sep:rgba(255,255,255,.09);
  --acc:#0a84ff;--warn:#ff9f0a;--red:#ff453a;--green:#30d158;
  --glass:rgba(36,38,46,.44);--glass2:rgba(34,36,44,.72);--gbrd:rgba(255,255,255,.11);--ghi:rgba(255,255,255,.16);
  --gsh:0 1px 1px rgba(0,0,0,.3),0 14px 36px -8px rgba(0,0,0,.55);
  --fill:rgba(118,118,128,.24);--lens:rgba(255,255,255,.15);--lsh:0 1px 2px rgba(0,0,0,.3),0 6px 18px -4px rgba(0,0,0,.5);
  --blob:.4;--sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 46%)}

/* ───────── Basis ───────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark;background:var(--bg)}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--txt);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Lebendiger Hintergrund */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;contain:strict}
.hid .bgfx i{animation-play-state:paused} /* Hintergrund pausiert, wenn Tab nicht sichtbar */
.bgfx i{position:absolute;width:78vmax;height:78vmax;border-radius:50%;opacity:var(--blob);will-change:transform;animation:drift var(--d,40s) ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:radial-gradient(closest-side,var(--acc),transparent);left:-28vmax;top:-30vmax;--d:38s;--dx:14vmax;--dy:10vmax}
.bgfx i:nth-child(2){background:radial-gradient(closest-side,#5ac8fa,transparent);right:-34vmax;top:4vh;--d:47s;--dx:-12vmax;--dy:14vmax;animation-delay:-14s}
.bgfx i:nth-child(3){background:radial-gradient(closest-side,#af52de,transparent);left:-10vmax;bottom:-40vmax;--d:53s;--dx:16vmax;--dy:-12vmax;animation-delay:-26s;opacity:calc(var(--blob)*.85)}
.bgfx i:nth-child(4){background:radial-gradient(closest-side,#ff6482,transparent);right:-30vmax;bottom:-34vmax;--d:44s;--dx:-14vmax;--dy:-8vmax;animation-delay:-8s;opacity:calc(var(--blob)*.6)}
.bgfx::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0,transparent 40%,color-mix(in srgb,var(--bg) 55%,transparent))}
@keyframes drift{to{transform:translate3d(var(--dx),var(--dy),0) scale(1.18)}}

/* Liquid-Glass-Material */
.gl{background:var(--sheen),var(--glass);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);border:.5px solid var(--gbrd);box-shadow:inset 0 1px 0 var(--ghi),inset 0 -.5px 0 rgba(255,255,255,.05),var(--gsh)}
/* Performance: Inhaltskarten brauchen weniger Unschärfe als Kopf/Tab-Leiste (dahinter liegt nur der Verlauf) */
.ev.gl,.card.gl,.list.gl,.tw.gl,.empty.gl,.ban.gl,.sk.gl{-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
/* Nutzer wünscht weniger Transparenz → deckende Flächen, kein Blur */
@media(prefers-reduced-transparency:reduce){.gl,.top,dialog{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--glass2)}.bgfx i{animation:none}}
.lens{position:absolute;left:0;border-radius:inherit;background:var(--sheen),var(--lens);border:.5px solid var(--gbrd);box-shadow:inset 0 1px 0 var(--ghi),var(--lsh);opacity:0;pointer-events:none;
  transition:transform .55s var(--spring),width .55s var(--spring),opacity .25s}
.lens.sq{animation:sq .55s var(--ease)}
@keyframes sq{35%{scale:1.12 .9}70%{scale:.98 1.03}}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.98)}}

/* ───────── Kopfbereich ───────── */
.top{position:sticky;top:0;z-index:20;padding:env(safe-area-inset-top) 16px 6px;background:var(--sheen),var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-bottom:.5px solid var(--sep);box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
.in{max-width:var(--mw);margin:0 auto}
.row1{display:flex;align-items:flex-end;justify-content:space-between;padding-top:12px;transition:.3s var(--ease)}
h1{margin:0;font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.03em;transition:font-size .3s var(--ease)}
.sub{font-size:13px;color:var(--sec);margin-top:3px;transition:.3s var(--ease);max-height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.row1>div:first-child{min-width:0;flex:1;margin-right:10px}
.top.s h1{font-size:20px}.top.s .sub{max-height:0;opacity:0;margin:0}.top.s .row1{align-items:center;padding-top:6px}
.tools{display:flex;gap:8px}
.ib{width:36px;height:36px;border-radius:50%;background:var(--fill);color:var(--acci);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--ghi);transition:transform .35s var(--spring),background .2s}
.ib:hover{background:color-mix(in srgb,var(--acc) 12%,var(--fill))}
.ib:active{transform:scale(.86)}.ib.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

.seg{position:relative;display:flex;background:var(--fill);border-radius:11px;padding:2px;margin:12px 0 10px}
.seg .lens{top:2px;bottom:2px;border-radius:9px}
.seg button{position:relative;z-index:1;flex:1;padding:6px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--sec);transition:color .25s}
.seg button.on{color:var(--txt)}

.wk{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 4px}
.mon{font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon span{color:var(--sec);font-weight:500;margin-left:6px;font-size:15px}
.nav{display:flex;align-items:center;background:var(--fill);border-radius:999px;padding:2px;box-shadow:inset 0 1px 0 var(--ghi);flex:none}
.nav button{height:30px;min-width:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--acci);transition:transform .35s var(--spring),background .2s,opacity .25s}
.nav button:hover{background:var(--fill)}.nav button:active{transform:scale(.86)}
.nav .td{padding:0 12px;font-size:14px;font-weight:600}.nav .td.dim{opacity:.55}

.stripw{position:relative;border-radius:16px}
.stripw .lens{top:0;bottom:0;border-radius:16px}
.strip{position:relative;z-index:1;display:flex;justify-content:space-between;gap:2px}
.strip.r{animation:inR .45s var(--ease)}.strip.l{animation:inL .45s var(--ease)}
.chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;color:var(--sec);font-size:12px;font-weight:600;border-radius:16px;transition:transform .35s var(--spring)}
.chip:active{transform:scale(.92)}
.chip b{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500;color:var(--txt);transition:.3s var(--ease);font-variant-numeric:tabular-nums}
.chip.today b{color:var(--acci);font-weight:700}.chip.sel b{font-weight:700}
.chip.today.sel b{background:var(--acc);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 45%,transparent)}
.chip i{display:flex;gap:3px;height:5px}.chip i s{width:5px;height:5px;border-radius:50%}

/* ───────── Inhalt ───────── */
main{max-width:var(--mw);margin:0 auto;padding:16px 16px calc(112px + env(safe-area-inset-bottom))}
#content.r{animation:inR .5s var(--ease)}#content.l{animation:inL .5s var(--ease)}#content.f{animation:fd .35s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.sk{height:84px;border-radius:20px;margin-bottom:10px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);background-size:220% 100%;animation:shm 1.4s infinite}@keyframes shm{from{background-position:120% 0}to{background-position:-120% 0}}

.ban{border-radius:20px;padding:14px 16px;margin-bottom:12px;animation:up .5s var(--ease) both;display:flex;gap:12px}
.ban .wi{flex:none;width:28px;height:28px;border-radius:50%;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;box-shadow:0 4px 12px color-mix(in srgb,var(--warn) 45%,transparent)}
.ban .bx{flex:1;min-width:0}.ban b{display:block;font-size:15px}.ban ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--sec)}
.ban button{color:var(--acci);font-weight:600;font-size:15px;margin-top:8px}

/* Live-Activity-Karte */
/* --c ist eine per JS abgedunkelte Modulfarbe (Weiß ≥ 5:1), --g die Originalfarbe für den Glow */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:26px;padding:18px 18px 18px 20px;color:#fff;margin-bottom:8px;cursor:pointer;animation:up .55s var(--ease) both;
  background:linear-gradient(140deg,var(--c) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 .5px rgba(255,255,255,.25),0 18px 40px -14px color-mix(in srgb,var(--g) 70%,transparent);transition:transform .4s var(--spring)}
.hero:active{transform:scale(.975)}.hero:focus-visible{outline:3px solid var(--txt);outline-offset:3px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 120% at 0 0,rgba(255,255,255,.12),transparent 55%),radial-gradient(60% 80% at 100% 100%,rgba(0,0,0,.18),transparent 60%);pointer-events:none}
.hero>*{position:relative}
.hx{flex:1;min-width:0}
.hero small{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.pulse{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pl 1.8s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.hero h2{margin:5px 0 3px;font-size:22px;line-height:1.18;letter-spacing:-.025em;font-weight:700}
.hero p{margin:0;font-size:15px;font-variant-numeric:tabular-nums}
.rg{position:relative;width:62px;height:62px;flex:none}
.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:5;stroke-linecap:round}.rg .t{stroke:rgba(255,255,255,.25)}.rg .v{stroke:#fff;transition:stroke-dashoffset 1s var(--ease);filter:drop-shadow(0 0 4px rgba(255,255,255,.5))}
.rg span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:600;opacity:.95;line-height:1}
.rg b{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:1px;font-variant-numeric:tabular-nums}
.tb{flex:none;text-align:center;padding:9px 12px;border-radius:16px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tb b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.tb span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}

.dh{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.05em;margin:22px 8px 8px}.dh.today{color:var(--acci)}
.bigday{font-size:24px;font-weight:700;margin:18px 4px 2px;letter-spacing:-.025em}.sum{font-size:14px;color:var(--sec);margin:0 4px 12px;font-variant-numeric:tabular-nums}

/* Termin-Karten (Glas mit Farbschimmer) */
.ev{--c:#007aff;display:flex;align-items:stretch;gap:12px;border-radius:20px;padding:13px 8px 13px 15px;margin-bottom:10px;animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms);transition:transform .4s var(--spring);
  background:var(--sheen),linear-gradient(105deg,color-mix(in srgb,var(--c) 16%,transparent),color-mix(in srgb,var(--c) 5%,transparent) 60%),var(--glass)}
.ev:active{transform:scale(.982)}.ev.ch{box-shadow:inset 0 0 0 2px var(--warn),var(--gsh)}
.tm{display:flex;flex-direction:column;justify-content:space-between;font-size:15px;font-weight:600;min-width:46px;font-variant-numeric:tabular-nums}.tm span{color:var(--sec);font-weight:500}
.bar{width:4px;border-radius:2px;background:var(--c);flex:none;box-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent)}
.bd{flex:1;min-width:0}.ti{font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.018em}.mt{font-size:14px;color:var(--sec);margin-top:2px}
.bg{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;color:#fff;background:var(--warn);border-radius:999px;padding:2px 9px}
.nt{margin-top:9px;padding:9px 11px;border-radius:12px;background:var(--fill);font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ac button{width:34px;height:34px;border-radius:50%;color:var(--sec);display:flex;align-items:center;justify-content:center;transition:transform .35s var(--spring),background .2s}
.ac button:hover{background:var(--fill)}.ac button:active{transform:scale(.85)}.ac button.has{color:var(--acci)}

/* Zeitraster */
.tw{display:flex;border-radius:22px;padding:12px 8px;overflow:hidden;animation:up .5s var(--ease) both}
.hrs{position:relative;width:34px;flex:none}.hrs span{position:absolute;right:6px;font-size:11px;color:var(--sec);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.cols{display:flex;flex:1;gap:3px;min-width:0}.col{position:relative;flex:1;min-width:0}
.hl{position:absolute;left:0;right:0;border-top:.5px solid var(--sep)}
.blk{position:absolute;border-radius:12px;padding:5px 8px;text-align:left;overflow:hidden;font-size:13px;line-height:1.2;animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms);transition:transform .35s var(--spring),filter .2s;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 20%,transparent));border-left:4px solid var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 .5px color-mix(in srgb,var(--c) 35%,transparent)}
.blk:hover{filter:brightness(1.06)}.blk:active{transform:scale(.97)}
.blk b{display:block;font-weight:600}.blk span{display:block;color:var(--sec);font-size:12px;margin-top:1px}
.blk.ch{box-shadow:inset 0 0 0 2px var(--warn)}
.cp .blk{padding:3px;font-size:10px;border-left-width:3px;border-radius:7px}.cp .blk b{font-size:11px}.cp .blk span{font-size:9px}
.gap{position:absolute;left:4px;right:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-style:italic;color:var(--sec);pointer-events:none}
.now{position:absolute;left:-4px;right:0;height:2px;background:var(--red);z-index:3;box-shadow:0 0 8px color-mix(in srgb,var(--red) 70%,transparent)}.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.gh{display:flex;margin:0 8px 6px 42px;gap:3px}.gh div{flex:1;text-align:center;font-size:12px;color:var(--sec);font-weight:600}.gh .today{color:var(--acci)}

/* Listen & Karten */
.list{border-radius:22px;overflow:hidden;margin-bottom:14px;animation:up .5s var(--ease) both}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;position:relative;transition:background .2s}
.li:hover{background:color-mix(in srgb,var(--txt) 4%,transparent)}.li:active{background:var(--fill)}
.li+.li::before{content:"";position:absolute;top:0;left:44px;right:0;border-top:.5px solid var(--sep)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}.li .g{flex:1;min-width:0}.li .ti{font-size:16px}
.li .mt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chev{color:var(--ter);flex:none}
.pill{font-size:11px;font-weight:700;color:var(--sec);background:var(--fill);border-radius:999px;padding:1px 7px;margin-left:6px}
.card{border-radius:22px;padding:16px 18px;margin-bottom:14px;animation:up .5s var(--ease) both}.card h3{margin:0 0 6px;font-size:13px;color:var(--sec);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.card .big{font-size:24px;font-weight:700;letter-spacing:-.025em}
.pb{height:8px;border-radius:4px;background:var(--fill);margin-top:12px;overflow:hidden}.pb u{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 70%,#fff),var(--acc));border-radius:4px;transition:width .8s var(--ease);box-shadow:0 0 10px color-mix(in srgb,var(--acc) 50%,transparent)}
.empty{text-align:center;color:var(--sec);padding:52px 16px;font-size:16px;border-radius:22px;animation:up .5s var(--ease) both}.empty b{display:block;font-size:46px;margin-bottom:8px}
footer{text-align:center;color:var(--sec);font-size:12px;margin-top:26px;font-variant-numeric:tabular-nums}

/* Schwebende Tab-Leiste */
.tabs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(340px,calc(100% - 40px));border-radius:999px;padding:4px}
.tabs div{position:relative;display:flex;border-radius:999px}
.tabs .lens{top:0;bottom:0;border-radius:999px}
.tabs button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;font-size:10px;font-weight:600;color:var(--sec);border-radius:999px;transition:color .25s,transform .35s var(--spring)}
.tabs button:active{transform:scale(.9)}.tabs button.on{color:var(--acci)}

/* Dialoge */
dialog{border:.5px solid var(--gbrd);padding:8px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;margin:auto auto 0;border-radius:30px 30px 0 0;color:var(--txt);max-height:92vh;
  background:var(--sheen),var(--glass2);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);box-shadow:inset 0 1px 0 var(--ghi),0 -12px 40px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:bf .3s ease both}
dialog.out::backdrop{animation:bf .22s ease reverse both}
@keyframes bf{from{opacity:0}}
dialog[open]{animation:sh .5s var(--ease)}dialog.out{animation:shx .24s ease-in forwards}
@keyframes sh{from{transform:translateY(100%)}to{transform:none}}@keyframes shx{to{transform:translateY(100%)}}
dialog::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--ter);margin:0 auto 14px}
@media(min-width:700px){
  dialog{margin:auto;max-width:460px;border-radius:28px;padding:24px 24px 22px;box-shadow:inset 0 1px 0 var(--ghi),0 30px 80px -20px rgba(0,0,0,.45)}
  dialog::before{display:none}
  dialog[open]{animation:zi .5s var(--spring)}dialog.out{animation:zo .2s ease-in forwards}
}
@keyframes zi{from{opacity:0;transform:scale(.9)}}@keyframes zo{to{opacity:0;transform:scale(.94)}}
dialog h2{font-size:22px;margin:0 0 10px;letter-spacing:-.025em}
label{display:block;font-size:13px;color:var(--sec);margin:14px 4px 6px;font-weight:500}
input[type=text],input[type=date],input[type=time],textarea{width:100%;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:0;border-radius:14px;background:var(--fill);color:var(--txt);transition:box-shadow .2s;-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=date]:focus,input[type=time]:focus,textarea:focus{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
textarea{min-height:120px;resize:vertical}.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.chk{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 0}
.tg{-webkit-appearance:none;appearance:none;width:51px;height:31px;margin:0;border-radius:16px;background:var(--fill);position:relative;cursor:pointer;flex:none;transition:background .25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .4s var(--spring)}
.tg:checked{background:var(--green)}.tg:checked::after{transform:translateX(20px)}
.sws{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 2px transparent;font-size:18px;display:flex;align-items:center;justify-content:center;transition:transform .35s var(--spring),box-shadow .2s}
.sw:hover{transform:scale(1.08)}.sw:active{transform:scale(.88)}
.sw.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--txt);transform:scale(1.04)}
.sw.e{background:var(--fill)}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:13px;border-radius:999px;font-weight:600;background:var(--fill);transition:transform .35s var(--spring),filter .2s}
.btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.95)}
.btn.p{background:var(--sheen),var(--acc);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -8px color-mix(in srgb,var(--acc) 80%,transparent)}
.btn.d{flex:none;color:var(--red);padding:13px 16px}
.err{color:var(--red);font-size:14px;min-height:18px;margin:8px 4px 0}

.q #content *,.q .hero,.q .ban{animation:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.bgfx i{animation:none}}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header class="top" id="top"><div class="in">
  <div class="row1">
    <div><h1 id="ttl">Stundenplan</h1><div class="sub" id="sub"></div></div>
    <div class="tools">
      <button class="ib" id="refreshBtn" aria-label="Aktualisieren" title="Aktualisieren"></button>
      <button class="ib" id="addBtn" aria-label="Modul hinzufügen" title="Modul hinzufügen"></button>
      <button class="ib" id="themeBtn" aria-label="Hell/Dunkel wechseln" title="Hell/Dunkel"></button>
    </div>
  </div>
  <div id="plantools">
    <div class="seg" id="seg"><i class="lens" id="segLens"></i><button data-v="day" title="Tag (1)">Tag</button><button data-v="week" title="Woche (2)">Woche</button><button data-v="grid" title="Raster (3)">Raster</button></div>
    <div class="wk">
      <div class="mon" id="mon"></div>
      <div class="nav">
        <button id="prevW" aria-label="Vorherige Woche" title="Vorherige Woche"></button>
        <button class="td" id="todayBtn" title="Heute (T)">Heute</button>
        <button id="nextW" aria-label="Nächste Woche" title="Nächste Woche"></button>
      </div>
    </div>
    <div class="stripw"><i class="lens" id="stripLens"></i><div class="strip" id="strip"></div></div>
  </div>
</div></header>
<main><div id="banner"></div><div id="hero"></div><div id="content"><div class="sk gl"></div><div class="sk gl"></div><div class="sk gl"></div></div><footer id="stand"></footer></main>
<nav class="tabs gl"><div>
  <i class="lens" id="tabLens"></i>
  <button data-t="plan" class="on" id="tPlan"></button><button data-t="notes" id="tNotes"></button><button data-t="mods" id="tMods"></button>
</div></nav>

<dialog id="modDlg">
  <h2 id="mTitle"></h2>
  <label>Farbe</label><div class="sws" id="mSw"></div>
  <label>Symbol</label><div class="sws" id="mEmo"></div>
  <label for="mNote">Notiz</label><textarea id="mNote" placeholder="Notiz zu diesem Modul …"></textarea>
  <div class="btns"><button class="btn d" id="mDel">Eigenes Modul löschen</button><button class="btn" id="mCancel">Abbrechen</button><button class="btn p" id="mSave">Sichern</button></div>
</dialog>
<dialog id="addDlg">
  <h2>Eigenes Modul</h2>
  <label for="fName">Name</label><input type="text" id="fName" autocomplete="off">
  <label for="fDate">Datum</label><input type="date" id="fDate">
  <div class="two"><div><label for="fStart">Von</label><input type="time" id="fStart"></div><div><label for="fEnd">Bis</label><input type="time" id="fEnd"></div></div>
  <label for="fRoom">Raum (optional)</label><input type="text" id="fRoom" autocomplete="off">
  <div class="chk"><span>Jede Woche wiederholen</span><input type="checkbox" class="tg" id="fRepeat"></div>
  <div id="untilWrap" style="display:none"><label for="fUntil">Wiederholen bis</label><input type="date" id="fUntil"></div>
  <label>Farbe</label><div class="sws" id="sws"></div>
  <div class="err" id="addErr"></div>
  <div class="btns"><button class="btn" id="addCancel">Abbrechen</button><button class="btn p" id="addSave">Hinzufügen</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const PALETTE=['#eab308','#8b5cf6','#22c55e','#ef4444','#3b82f6','#ec4899','#06b6d4','#64748b','#f97316','#84cc16'];
const ACC=['','#8b5cf6','#22c55e','#f97316','#ec4899','#ef4444'];
const EMO=['','📘','💻','📐','📊','🧠','🎓','🧪','💼','⭐'];
const DS=['So','Mo','Di','Mi','Do','Fr','Sa'],DL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MO=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const svg=(p,s=20,w=2)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={plus:svg('<path d="M12 5v14M5 12h14"/>'),pen:svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',18),
moon:svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>'),sun:svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
ref:svg('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>'),cal:svg('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',24),
note:svg('<path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6"/>',24),grid:svg('<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',24),
prev:svg('<path d="m15 18-6-6 6-6"/>',18,2.4),next:svg('<path d="m9 18 6-6-6-6"/>',18,2.4),chev:svg('<path d="m9 18 6-6-6-6"/>',16,2.2)};
const store={get(k,d){try{const v=localStorage.getItem('stundenplan.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('stundenplan.'+k,JSON.stringify(v))}catch(e){}}};
let events=[],custom=store.get('custom',[]),notes=store.get('notes',{}),mods=store.get('mods',{}),titleColor={},sel=new Date(),view=store.get('view','day'),tab='plan',lastDate='',noteKey=null,selC=0,selI='',started=false,offline=false,genAt='',openBan=false,shownWeek='';
const PX=1.1;
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},fmt=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const toMin=s=>{const[h,m]=s.split(':');return +h*60+ +m},nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const kw=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/864e5+1)/7)};
const skipSun=(d,n)=>{while(d.getDay()===0)d=addDays(d,n||1);return d};
const stamp=d=>d.toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'});
/* Kontrast: Farbe so weit abdunkeln, bis weißer Text ≥ 5:1 erreicht (WCAG AA mit Reserve) */
const lum=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);
const shade=(h,k)=>'#'+[1,3,5].map(i=>Math.round(parseInt(h.slice(i,i+2),16)*k).toString(16).padStart(2,'0')).join('');
const onWhite=h=>{let k=1,x=h;while(1.05/(lum(x)+.05)<5&&k>.3){k-=.02;x=shade(h,k)}return x};
const dur=m=>m>=60?Math.floor(m/60)+' Std'+(m%60?' '+m%60+' Min':''):m+' Min';

/* Theme + Akzent */
const root=document.documentElement;
const dark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
const themeIcon=()=>$('themeBtn').innerHTML=dark()?IC.sun:IC.moon;
$('themeBtn').onclick=()=>{const n=dark()?'light':'dark';root.dataset.theme=n;store.set('theme',n);themeIcon()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',themeIcon);
$('addBtn').innerHTML=IC.plus;$('refreshBtn').innerHTML=IC.ref;$('prevW').innerHTML=IC.prev;$('nextW').innerHTML=IC.next;themeIcon();
$('tPlan').innerHTML=IC.cal+'<span>Plan</span>';$('tNotes').innerHTML=IC.note+'<span>Notizen</span>';$('tMods').innerHTML=IC.grid+'<span>Module</span>';
addEventListener('scroll',()=>$('top').classList.toggle('s',scrollY>24),{passive:true});

/* Glas-Linsen (gleitende Auswahl) */
function placeLens(l,el){if(!el||!el.offsetWidth){l.style.opacity=0;return}
  const x=el.offsetLeft,w=el.offsetWidth,first=l.dataset.x==null||l.style.opacity==='0'||!l.style.opacity;
  if(first){l.style.transition='none'}
  l.style.width=w+'px';l.style.transform=`translateX(${x}px)`;l.style.opacity=1;
  if(first){void l.offsetWidth;l.style.transition=''}
  else if(l.dataset.x!==String(x)){l.classList.remove('sq');void l.offsetWidth;l.classList.add('sq')}
  l.dataset.x=x}
function placeLenses(){placeLens($('tabLens'),document.querySelector('.tabs button.on'));
  if(tab==='plan'){placeLens($('segLens'),document.querySelector('.seg button.on'));placeLens($('stripLens'),document.querySelector('.chip.sel'))}}
addEventListener('resize',placeLenses);

/* Farben, Namen */
function buildColors(){titleColor={};[...new Set(events.map(e=>e.title))].sort((a,b)=>a.localeCompare(b,'de')).forEach((t,i)=>titleColor[t]=i%PALETTE.length)}
const baseIdx=t=>titleColor[t]??(custom.find(c=>c.title===t)||{color:0}).color%PALETTE.length;
const colorOf=e=>{const m=mods[e.title];return m&&m.c!=null?PALETTE[m.c]:e.custom?PALETTE[e.color%PALETTE.length]:PALETTE[titleColor[e.title]??0]};
const iconOf=e=>(mods[e.title]||{}).i||'';
const label=e=>(iconOf(e)?iconOf(e)+' ':'')+(e.type?e.type+' ':'')+e.title;
const short=e=>iconOf(e)||e.title.split(/\s+/).filter(w=>w.length>3).map(w=>w[0].toUpperCase()).join('').slice(0,3)||e.title.slice(0,2);
function eventsOn(day){const d=iso(day);
  const own=custom.filter(c=>c.date===d||(c.until&&c.date<d&&c.until>=d&&new Date(c.date+'T12:00:00').getDay()===day.getDay()))
    .map(c=>({...c,date:d,type:'',group:null,lecturer:null,note:null,changed:false,custom:true}));
  return [...events.filter(e=>e.date===d),...own].sort((a,b)=>a.start.localeCompare(b.start))}

/* Semester */
function semester(){if(!events.length)return null;const ms=[];let m=monday(new Date(events[0].date+'T12:00:00'));const last=new Date(events[events.length-1].date+'T12:00:00');
  while(m<=last){ms.push(m);m=addDays(m,7)}const i=ms.findIndex(x=>iso(x)===iso(monday(new Date())));
  return{n:ms.length,i:i>=0?i:(new Date()<ms[0]?-1:ms.length),start:ms[0]}}

/* Änderungsbanner */
const ekey=e=>[e.date,e.start,e.type,e.title,e.group||''].join('|'),edesc=e=>`${e.title} ${fmt(new Date(e.date+'T12:00:00'))} ${e.start}`;
function snapshot(){const t=iso(new Date()),s={};events.filter(e=>e.date>=t).forEach(e=>s[ekey(e)]={r:e.room||'',d:e.date,s:edesc(e)});store.set('seen',s)}
function diff(){const seen=store.get('seen',null);if(!seen)return[];const t=iso(new Date()),cur={},out=[];
  events.filter(e=>e.date>=t).forEach(e=>cur[ekey(e)]=e);
  for(const k in cur){const e=cur[k];if(!(k in seen))out.push('Neu: '+edesc(e)+(e.room?' ('+e.room+')':''));else if(seen[k].r!==(e.room||''))out.push(`Raum: ${edesc(e)}: ${seen[k].r||'–'} → ${e.room||'–'}`)}
  for(const k in seen)if(seen[k].d>=t&&!(k in cur))out.push('Entfällt: '+seen[k].s);return out}
function renderBanner(){const d=tab==='plan'?diff():[];
  $('banner').innerHTML=d.length?`<div class="ban gl"><i class="wi">!</i><div class="bx"><b>${d.length} Änderung${d.length>1?'en':''} seit deinem letzten Besuch</b>${openBan?'<ul>'+d.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}<button data-b="tog">${openBan?'Weniger':'Anzeigen'}</button> <button data-b="ok" style="margin-left:14px">Gelesen</button></div></div>`:''}
$('banner').onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;if(b.dataset.b==='ok'){snapshot();openBan=false}else openBan=!openBan;renderBanner()};

/* Darstellung */
function evHTML(e,i){const meta=[e.group,e.lecturer,e.room].filter(Boolean).map(esc).join(' · '),n=notes[e.title];
  return `<div class="ev gl ${e.changed?'ch':''}" style="--c:${colorOf(e)};--i:${i}"><div class="tm">${esc(e.start)}<span>${esc(e.end)}</span></div><i class="bar"></i>
  <div class="bd"><div class="ti">${esc(label(e))}</div>${meta?`<div class="mt">${meta}</div>`:''}${e.changed?`<span class="bg">${esc(e.note||'Änderung')}</span>`:''}${n?`<div class="nt">${esc(n)}</div>`:''}</div>
  <div class="ac"><button class="${n?'has':''}" data-a="mod" data-t="${esc(e.title)}" aria-label="Modul bearbeiten">${IC.pen}</button></div></div>`}
function lanes(list){const out=[];let cl=[],end=0;const flush=()=>{const n=Math.max(...cl.map(x=>x.l))+1;cl.forEach(x=>x.n=n);out.push(...cl);cl=[]};
  for(const e of list){const s=toMin(e.start);if(cl.length&&s>=end)flush();const used=cl.filter(x=>toMin(x.e.end)>s).map(x=>x.l);let l=0;while(used.includes(l))l++;cl.push({e,l});end=Math.max(end,toMin(e.end))}
  if(cl.length)flush();return out}
function range(days){let lo=480,hi=1020;days.forEach(d=>eventsOn(d).forEach(e=>{lo=Math.min(lo,toMin(e.start));hi=Math.max(hi,toMin(e.end))}));return[Math.floor(lo/60)*60,Math.ceil(hi/60)*60]}
const hours=(a,b)=>{let h=`<div class="hrs" style="height:${(b-a)*PX}px">`;for(let m=a;m<b;m+=60)h+=`<span style="top:${(m-a)*PX}px">${pad(m/60)}</span>`;return h+'</div>'};
function col(day,a,b,cp){const list=eventsOn(day);let h=`<div class="col ${cp?'cp':''}" style="height:${(b-a)*PX}px">`;
  for(let m=a;m<b;m+=60)h+=`<i class="hl" style="top:${(m-a)*PX}px"></i>`;
  lanes(list).forEach(({e,l,n},i)=>{const s=toMin(e.start),t=toMin(e.end);
    h+=`<button class="blk ${e.changed?'ch':''}" data-a="mod" data-t="${esc(e.title)}" style="--c:${colorOf(e)};--i:${i};top:${(s-a)*PX}px;height:${(t-s)*PX-2}px;left:calc(${l/n*100}% + 1px);width:calc(${100/n}% - 3px)">
    <b>${cp?esc(short(e)):esc(e.start+' '+label(e))}</b><span>${esc(e.room||'')}${!cp&&notes[e.title]?' 📝':''}</span></button>`});
  if(!cp){let pe=null;for(const e of list){const s=toMin(e.start);if(pe!==null&&s-pe>=20)h+=`<em class="gap" style="top:${(pe-a)*PX}px;height:${(s-pe)*PX}px">Pause · ${s-pe} Min</em>`;pe=Math.max(pe??0,toMin(e.end))}}
  if(iso(day)===iso(new Date())){const n=nowMin();if(n>=a&&n<=b)h+=`<u class="now" style="top:${(n-a)*PX}px"></u>`}
  return h+'</div>'}
function monthLabel(w){const e=addDays(w,5),a=w.getMonth(),b=e.getMonth();
  return a===b?`${MO[a]} ${w.getFullYear()}`:`${MO[a].slice(0,3)}${w.getFullYear()!==e.getFullYear()?' '+w.getFullYear():''} – ${MO[b].slice(0,3)} ${e.getFullYear()}`}
function renderStrip(){const w=monday(sel),td=iso(new Date()),s=semester();
  $('strip').innerHTML=[0,1,2,3,4,5].map(i=>{const d=addDays(w,i),cols=[...new Set(eventsOn(d).map(colorOf))].slice(0,3);
    return `<button class="chip ${iso(d)===iso(sel)&&view==='day'?'sel':''} ${iso(d)===td?'today':''}" data-d="${iso(d)}" aria-label="${DL[d.getDay()]}, ${fmt(d)}"><span>${DS[d.getDay()]}</span><b>${d.getDate()}</b><i>${cols.map(c=>`<s style="background:${c}"></s>`).join('')}</i></button>`}).join('');
  $('mon').innerHTML=`${monthLabel(w)}<span>KW ${kw(sel)}</span>`;
  $('sub').textContent=`KW ${kw(sel)}${s&&s.i>=0&&s.i<s.n?' · Woche '+(s.i+1)+'/'+s.n:''} · ${fmt(w)}–${fmt(addDays(w,5))}${w.getFullYear()}`;
  const t=todayTarget(),dim=view==='day'?iso(sel)===iso(t):iso(monday(sel))===iso(monday(t));$('todayBtn').classList.toggle('dim',dim);$('todayBtn').setAttribute('aria-disabled',dim)}
function nextEv(){const now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  for(let i=0;i<30;i++){const d=addDays(now,i);for(const e of eventsOn(d)){if(i===0&&e.end<=hm)continue;return{e,d,i,run:i===0&&e.start<=hm,hm}}}return null}
function renderHero(){const h=$('hero');if(tab!=='plan'){h.innerHTML='';return}const x=nextEv();if(!x){h.innerHTML='';return}
  const{e,d,i,run,hm}=x,now=toMin(hm),room=e.room?' · '+esc(e.room):'';let l,p,side;
  if(run){const left=toMin(e.end)-now,pr=Math.min(1,Math.max(0,(now-toMin(e.start))/(toMin(e.end)-toMin(e.start)))),C=2*Math.PI*26;
    l='<i class="pulse"></i>Läuft gerade';p=`bis ${e.end}${room}`;
    side=`<div class="rg" aria-label="noch ${left} Minuten"><svg viewBox="0 0 62 62"><circle class="t" cx="31" cy="31" r="26"/><circle class="v" cx="31" cy="31" r="26" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-pr)).toFixed(2)}"/></svg><span><b>${left>=100?Math.round(left/60)+'h':left}</b>${left>=100?'übrig':'Min'}</span></div>`}
  else{const m=toMin(e.start)-now;l='Als Nächstes';
    p=(i===0?'in '+dur(m):i===1?'Morgen':`${DL[d.getDay()]}, ${fmt(d)}`)+room;
    side=`<div class="tb"><b>${esc(e.start)}</b><span>${i===0?'Heute':i===1?'Morgen':DS[d.getDay()]}</span></div>`}
  const c=colorOf(e);h.innerHTML=`<div class="hero" role="button" tabindex="0" style="--c:${onWhite(c)};--g:${c}" data-d="${iso(d)}"><div class="hx"><small>${l}</small><h2>${esc(label(e))}</h2><p>${p}</p></div>${side}</div>`}
function renderPlan(){const w=monday(sel);let h='';
  if(view==='day'){const l=eventsOn(sel),[a,b]=range([sel]);h=`<div class="bigday">${DL[sel.getDay()]}, ${sel.getDate()}. ${MO[sel.getMonth()]}</div>`;
    if(l.length){const tot=l.reduce((s,e)=>s+toMin(e.end)-toMin(e.start),0);h+=`<div class="sum">${l.length} Termin${l.length>1?'e':''} · ${l[0].start}–${l[l.length-1].end} · ${Math.floor(tot/60)} Std ${tot%60} Min</div><div class="tw gl">${hours(a,b)}<div class="cols">${col(sel,a,b,false)}</div></div>`}
    else h+='<div class="empty gl"><b>🎉</b>Keine Termine</div>'}
  else if(view==='grid'){const ds=[0,1,2,3,4,5].map(i=>addDays(w,i)),[a,b]=range(ds);
    h=`<div class="gh">${ds.map(d=>`<div class="${iso(d)===iso(new Date())?'today':''}">${DS[d.getDay()]} ${d.getDate()}</div>`).join('')}</div><div class="tw gl">${hours(a,b)}<div class="cols">${ds.map(d=>col(d,a,b,true)).join('')}</div></div>`}
  else{let n=0;for(let i=0;i<6;i++){const d=addDays(w,i),l=eventsOn(d);if(!l.length)continue;h+=`<div class="dh ${iso(d)===iso(new Date())?'today':''}">${DL[d.getDay()]}, ${fmt(d)}</div>`+l.map(e=>evHTML(e,n++)).join('')}
    if(!h)h='<div class="empty gl"><b>🎉</b>Keine Termine in dieser Woche</div>'}return h}
function modules(){const m={};events.forEach(e=>{(m[e.title]??={t:e.title,c:colorOf(e),n:0,own:false,i:iconOf(e)}).n++});
  custom.forEach(c=>{(m[c.title]??={t:c.title,c:colorOf({...c,custom:true}),n:0,own:true,i:(mods[c.title]||{}).i||''}).n++});return Object.values(m).sort((a,b)=>a.t.localeCompare(b.t,'de'))}
const row=(m,sub)=>`<button class="li" data-a="mod" data-t="${esc(m.t)}"><i class="dot" style="background:${m.c};color:${m.c}"></i><div class="g"><div class="ti">${esc((m.i?m.i+' ':'')+m.t)}${m.own?'<span class="pill">Eigen</span>':''}</div><div class="mt">${sub}</div></div><span class="chev">${IC.chev}</span></button>`;
function renderNotes(){const ks=Object.keys(notes);if(!ks.length)return '<div class="empty gl"><b>✏️</b>Noch keine Notizen.<br>Tippe bei einem Modul auf den Stift.</div>';
  const ms=modules(),c={};ms.forEach(m=>c[m.t]=m);return '<div class="list gl">'+ks.map(k=>row(c[k]||{t:k,c:'#8e8e93'},esc(notes[k]))).join('')+'</div>'}
function renderMods(){const s=semester();let h='';
  if(s){const t=s.i<0?`Beginnt am ${fmt(s.start)}${s.start.getFullYear()}`:s.i>=s.n?'Vorlesungszeit beendet':`Woche ${s.i+1} von ${s.n}`;const p=s.i<0?0:s.i>=s.n?100:(s.i+1)/s.n*100;
    h+=`<div class="card gl"><h3>Semester</h3><div class="big">${t}</div>${s.i>=0&&s.i<s.n?`<div class="mt">noch ${s.n-s.i-1} Wochen</div>`:''}<div class="pb"><u style="width:${p}%"></u></div></div>`}
  h+=`<div class="card gl"><h3>Akzentfarbe</h3><div class="sws">${ACC.map((c,i)=>`<button class="sw ${(store.get('accent',null)||'')===c?'sel':''}" data-acc="${c}" style="background:${c||'#007aff'}" aria-label="Akzent ${i+1}"></button>`).join('')}</div></div>`;
  const ms=modules();return h+(ms.length?'<div class="list gl">'+ms.map(m=>row(m,`${m.n} Termine${notes[m.t]?' · Notiz vorhanden':''}`)).join('')+'</div>':'<div class="empty gl">Keine Module geladen.</div>')}
function anim(el,cls){el.classList.remove('r','l','f');if(cls){void el.offsetWidth;el.classList.add(cls)}}
function render(dir,fade,quiet){const c=$('content');document.body.classList.toggle('q',!!quiet);
  $('plantools').style.display=tab==='plan'?'':'none';
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='plan'){renderStrip();c.innerHTML=renderPlan();$('ttl').textContent='Stundenplan';
    const wk=iso(monday(sel));if(shownWeek&&wk!==shownWeek)anim($('strip'),wk>shownWeek?'r':'l');shownWeek=wk}
  else{$('ttl').textContent=tab==='notes'?'Notizen':'Module';$('sub').textContent=tab==='notes'?Object.keys(notes).length+' gespeichert':modules().length+' Module';c.innerHTML=tab==='notes'?renderNotes():renderMods()}
  renderBanner();renderHero();anim(c,dir?(dir>0?'r':'l'):fade?'f':'');placeLenses()}
function shift(n){sel=view==='day'?skipSun(addDays(sel,n),n):addDays(sel,7*n);render(n)}
function shiftWeek(n){sel=addDays(sel,7*n);render(n)}
function todayTarget(){const t=iso(new Date()),cur=monday(new Date());let d=new Date();
  if(events.length&&!events.some(e=>e.date>=iso(cur)&&e.date<=iso(addDays(cur,5)))){const nx=events.find(e=>e.date>=t);d=nx?new Date(nx.date+'T12:00:00'):new Date(events[events.length-1].date+'T12:00:00')}
  return skipSun(d)}
function jumpToday(){const t=todayTarget(),a=iso(view==='day'?sel:monday(sel)),b=iso(view==='day'?t:monday(t));sel=t;render(a===b?0:b>a?1:-1)}

/* Eingaben */
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.v;store.set('view',view);render(0,1)});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(tab===b.dataset.t){scrollTo({top:0,behavior:'smooth'});return}tab=b.dataset.t;render(0,1);scrollTo(0,0)});
$('strip').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const d=new Date(b.dataset.d+'T12:00:00'),dir=view==='day'?Math.sign(d-sel):0;sel=d;view='day';store.set('view',view);render(dir,!dir)};
$('hero').onclick=e=>{const h=e.target.closest('.hero');if(!h)return;sel=new Date(h.dataset.d+'T12:00:00');view='day';render(0,1)};
/* Tastatur: Enter/Leertaste öffnen den Tag wie ein Klick */
$('hero').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('hero')){e.preventDefault();e.target.click()}};
$('prevW').onclick=()=>shiftWeek(-1);$('nextW').onclick=()=>shiftWeek(1);$('todayBtn').onclick=jumpToday;

/* Mac: Tastatur ← → (T = heute, 1/2/3 = Ansicht) */
document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){if(tab!=='plan')return;e.preventDefault();const n=e.key==='ArrowRight'?1:-1;e.shiftKey?shiftWeek(n):shift(n)}
  else if(e.key==='t'||e.key==='T'){if(tab!=='plan'){tab='plan';scrollTo(0,0)}jumpToday()}
  else if(tab==='plan'&&'123'.includes(e.key)&&e.key){view=['day','week','grid'][+e.key-1];store.set('view',view);render(0,1)}});

/* Mac: Trackpad-Wischen mit zwei Fingern */
let wx=0,wLock=0,wReset;
addEventListener('wheel',e=>{if(tab!=='plan'||document.querySelector('dialog[open]'))return;
  if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)*1.2)return;
  e.preventDefault();const t=Date.now();
  if(t<wLock){wLock=t+260;return}   /* Nachschwung des Trackpads abwarten */
  wx+=e.deltaX;clearTimeout(wReset);wReset=setTimeout(()=>wx=0,200);
  if(Math.abs(wx)>60){shift(wx>0?1:-1);wx=0;wLock=t+260}},{passive:false});

const drawM=()=>{$('mSw').innerHTML=PALETTE.map((c,i)=>`<button type="button" class="sw ${i===selC?'sel':''}" style="background:${c}" data-c="${i}" aria-label="Farbe ${i+1}"></button>`).join('');
  $('mEmo').innerHTML=EMO.map(e=>`<button type="button" class="sw e ${e===selI?'sel':''}" data-e="${e}" aria-label="Symbol">${e||'–'}</button>`).join('')};
$('mSw').onclick=e=>{const b=e.target.closest('[data-c]');if(b){selC=+b.dataset.c;drawM()}};
$('mEmo').onclick=e=>{const b=e.target.closest('[data-e]');if(b){selI=b.dataset.e;drawM()}};
const closeDlg=d=>{if(!d.open||d.classList.contains('out'))return;d.classList.add('out');setTimeout(()=>{d.classList.remove('out');d.close()},matchMedia('(prefers-reduced-motion:reduce)').matches?0:230)};
document.body.addEventListener('click',e=>{
  const a=e.target.closest('[data-acc]');if(a){const v=a.dataset.acc;if(v){root.style.setProperty('--acc',v);store.set('accent',v)}else{root.style.removeProperty('--acc');localStorage.removeItem('stundenplan.accent')}render();return}
  const b=e.target.closest('[data-a="mod"]');if(!b)return;noteKey=b.dataset.t;const m=mods[noteKey]||{};
  selC=m.c!=null?m.c:baseIdx(noteKey);selI=m.i||'';$('mTitle').textContent=noteKey;$('mNote').value=notes[noteKey]||'';
  $('mDel').style.display=custom.some(c=>c.title===noteKey)?'':'none';drawM();$('modDlg').showModal()});
$('mSave').onclick=()=>{mods[noteKey]={c:selC,i:selI};store.set('mods',mods);const v=$('mNote').value.trim();v?notes[noteKey]=v:delete notes[noteKey];store.set('notes',notes);closeDlg($('modDlg'));render()};
$('mDel').onclick=()=>{if(confirm('Alle eigenen Termine dieses Moduls löschen?')){custom=custom.filter(c=>c.title!==noteKey);store.set('custom',custom);closeDlg($('modDlg'));render()}};
$('mCancel').onclick=()=>closeDlg($('modDlg'));

/* iPhone: Wischen */
let tx=0,ty=0,tr=false;
document.addEventListener('touchstart',e=>{if(document.querySelector('dialog[open]')||tab!=='plan')return;tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;tr=true},{passive:true});
document.addEventListener('touchend',e=>{if(!tr)return;tr=false;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)shift(dx<0?1:-1)},{passive:true});

/* Modul hinzufügen */
let addC=0;
const drawSw=()=>$('sws').innerHTML=PALETTE.map((c,i)=>`<button type="button" class="sw ${i===addC?'sel':''}" style="background:${c}" data-i="${i}" aria-label="Farbe ${i+1}"></button>`).join('');
$('sws').onclick=e=>{const b=e.target.closest('.sw');if(b){addC=+b.dataset.i;drawSw()}};
$('fRepeat').onchange=()=>$('untilWrap').style.display=$('fRepeat').checked?'block':'none';
$('addBtn').onclick=()=>{['fName','fRoom','fStart','fEnd'].forEach(i=>$(i).value='');$('fDate').value=iso(sel);$('fRepeat').checked=false;$('untilWrap').style.display='none';$('fUntil').value=lastDate;$('addErr').textContent='';
  addC=Object.keys(titleColor).length%PALETTE.length;drawSw();$('addDlg').showModal()};
$('addCancel').onclick=()=>closeDlg($('addDlg'));
$('addSave').onclick=()=>{const name=$('fName').value.trim(),date=$('fDate').value,s=$('fStart').value,en=$('fEnd').value,rep=$('fRepeat').checked,u=$('fUntil').value;let err='';
  if(!name)err='Bitte einen Namen eingeben.';else if(!date)err='Bitte ein Datum wählen.';else if(!s||!en||en<=s)err='Die Endzeit muss nach der Startzeit liegen.';else if(rep&&(!u||u<date))err='Das Enddatum muss nach dem Startdatum liegen.';
  if(err){$('addErr').textContent=err;return}
  custom.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:name,date,start:s,end:en,room:$('fRoom').value.trim()||null,color:addC,until:rep?u:null});
  store.set('custom',custom);sel=skipSun(new Date(date+'T12:00:00'));tab='plan';closeDlg($('addDlg'));render(0,1)};
['modDlg','addDlg'].forEach(id=>{const d=$(id);d.addEventListener('click',e=>{if(e.target===d)closeDlg(d)});d.addEventListener('cancel',e=>{e.preventDefault();closeDlg(d)})});

/* Laden (mit Offline-Speicher) */
let loading=false,loadedAt=0;
function apply(d){events=d.events;genAt=d.generated;lastDate=events.reduce((m,e)=>e.date>m?e.date:m,'');buildColors();
  if(!store.get('seen',null))snapshot();
  $('stand').innerHTML=(offline?'Offline · ':'')+`Stand der Daten: ${stamp(new Date(genAt))}`+(offline?'':`<br>Zuletzt geprüft: ${stamp(new Date())}`);
  if(!started){started=true;sel=todayTarget();render(0,1)}else render()}
async function loadData(manual){if(loading)return;loading=true;$('refreshBtn').classList.add('spin');
  try{const r=await fetch('stundenplan.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();
    store.set('cache',d);offline=false;loadedAt=Date.now();apply(d)}
  catch(e){offline=true;if(!started){$('content').innerHTML='<div class="empty gl">Keine Verbindung und noch keine gespeicherten Daten.</div>'}
    else{$('stand').innerHTML=`Offline · Stand der Daten: ${stamp(new Date(genAt))}`;if(manual)alert('Du bist offline. Es werden die zuletzt gespeicherten Daten angezeigt.')}}
  finally{loading=false;$('refreshBtn').classList.remove('spin')}}
$('refreshBtn').onclick=()=>loadData(true);
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('hid',document.hidden);if(document.visibilityState==='visible'&&Date.now()-loadedAt>30000)loadData(false)});
addEventListener('pageshow',e=>{if(e.persisted)loadData(false)});
addEventListener('online',()=>loadData(false));
setInterval(()=>{if(!document.hidden){document.body.classList.add('q');renderHero();if(tab==='plan'&&view!=='week')render(0,0,1)}},60000);
placeLenses();
const cached=store.get('cache',null);if(cached&&cached.events)apply(cached);
loadData(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
